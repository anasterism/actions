name: Tests

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '9.*'
            testbench: '7.*'
            allow-advisories: true
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            allow-advisories: true
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
            allow-advisories: true
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            allow-advisories: true
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            allow-advisories: true
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      # Every release of these end-of-life Laravel versions has unpatched security advisories,
      # which Composer refuses to install by default. They're still supported, so allow them here only.
      - name: Allow advisories for end-of-life Laravel versions
        if: matrix.allow-advisories
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
